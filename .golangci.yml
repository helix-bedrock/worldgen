version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    staticcheck:
      checks:
        - all
        # The code keeps BDS's comparisons as written: on floats !(a > b) and
        # a <= b differ for NaN, so De Morgan rewrites could change output.
        - -QF1001
        # Defaults the "all" above would turn on.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    forbidigo:
      # Never panic, anywhere: see AGENT_RULES.md in helix-bedrock/.github.
      forbid:
        - pattern: ^panic$
          msg: never panic; return an error instead
        - pattern: ^log\.Fatal.*$
          msg: never exit the process; return an error instead
        - pattern: ^os\.Exit$
          msg: never exit the process; return an error instead
    gosec:
      excludes:
        - G115 # integer conversions are everywhere in binary formats; review them instead
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - forbidigo
      # Test-only helpers imported by leveldb's tests, never by library code.
      - path: leveldb/testutil/
        linters:
          - gosec
          - unparam
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
